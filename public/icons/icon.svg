<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nfcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer NFC wave -->
  <path d="M 330 140 A 150 150 0 0 1 330 372" fill="none" stroke="#10B981" stroke-width="26" stroke-linecap="round" />
  
  <!-- Middle NFC wave -->
  <path d="M 285 185 A 90 90 0 0 1 285 327" fill="none" stroke="#34D399" stroke-width="24" stroke-linecap="round" />
  
  <!-- Inner NFC wave -->
  <path d="M 240 230 A 35 35 0 0 1 240 282" fill="none" stroke="#6EE7B7" stroke-width="22" stroke-linecap="round" />
  
  <!-- Map Pin / Location marker with star -->
  <g transform="translate(130, 160)">
    <path d="M 50 0 C 22.4 0 0 22.4 0 50 C 0 87.5 50 145 50 145 C 50 145 100 87.5 100 50 C 100 22.4 77.6 0 50 0 Z" fill="url(#nfcGrad)" />
    <!-- Review star inside pin -->
    <polygon points="50,22 56,38 73,38 59,48 64,64 50,54 36,64 41,48 27,38 44,38" fill="#FDE047" />
  </g>
</svg>
